[package]
name = "wmm"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "World Music Model — symbolic music generation and response"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Pinned to the latest stable releases checked on crates.io, 22 Oct 2026.
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
csv = "=1.4.0"
midly = "=0.5.3"
rustysynth = "=1.3.8"
hound = "=3.5.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
candle-core = "=0.11.0"
candle-nn = "=0.11.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[profile.release]
opt-level = 3
lto = "thin"
